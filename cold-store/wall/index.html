<html lang="en">
<head>

<title>Cold-Store Results Wall</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a projector wall; entry strip on top for the lecturer, then one card per pair in a sortable grid. */
:root {
  --bg: #FFFFFF; --panel: #F3F5F8; --line: #DCE1E7; --fg: #1A1F26; --muted: #4E5866;
  --accent: #A35F00; --accent-bg: #FDF1DE; --accent-line: #F0A23B; --rule-a: #66CCFF; --rule-b: #8A9099;
  --good: #1E7A45; --good-bg: #E4F4EA; --warn: #8A5A00; --warn-bg: #FFF3D6; --bad: #A3262A; --bad-bg: #FBE5E5;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151B; --panel: #1A2029; --line: #2C3440; --fg: #E8ECF1; --muted: #A4AEBB;
  --accent: #F2B25C; --accent-bg: #2B2214; --accent-line: #C9852A; --rule-a: #3A8FB8; --rule-b: #5A616B;
  --good: #6FD39A; --good-bg: #16291F; --warn: #F2C66B; --warn-bg: #2C2414; --bad: #F08A8A; --bad-bg: #2E1717; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151B; --panel: #1A2029; --line: #2C3440; --fg: #E8ECF1; --muted: #A4AEBB;
  --accent: #F2B25C; --accent-bg: #2B2214; --accent-line: #C9852A; --rule-a: #3A8FB8; --rule-b: #5A616B;
  --good: #6FD39A; --good-bg: #16291F; --warn: #F2C66B; --warn-bg: #2C2414; --bad: #F08A8A; --bad-bg: #2E1717; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px }
.wrap { max-width: 1600px; margin: 0 auto }
.rules { height: 7px; border-top: 3px solid var(--rule-a); border-bottom: 3px solid var(--rule-b); margin-top: 16px }
header { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 16px }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
h1 { font: 700 clamp(26px, 4vw, 40px)/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance }
.scan { display: flex; align-items: center; gap: 14px; background: var(--panel); border-radius: 12px; padding: 10px 14px 10px 10px }
.scan img { width: 96px; height: 96px; border-radius: 6px; display: block }
.scan p { margin: 0; font-size: 14px; color: var(--muted); max-width: 26ch }
.scan b { color: var(--fg) }
.entry { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; background: var(--panel); border-radius: 12px; padding: 14px }
.entry label { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.entry input { font: 600 18px var(--body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0 }
#team { width: min(260px, 100%) }
#code { width: 130px; font-family: var(--mono); letter-spacing: .15em }
.entry input:focus-visible, button:focus-visible { outline: 3px solid var(--rule-a); outline-offset: 1px }
button { font: 600 15px var(--body); border-radius: 8px; padding: 10px 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg) }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.msg { font-size: 14px; color: var(--muted); flex: 1 1 200px; min-width: 0 }
.msg.err { color: var(--bad) }
.tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-block: 16px }
.sort { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.sort span { font-size: 13px; color: var(--muted); margin-right: 4px }
.sort button { padding: 6px 12px; font-size: 14px; border-radius: 999px }
.sort button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-line); color: var(--fg) }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) }
.card { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; background: var(--bg); min-width: 0; position: relative }
.card.example { border-style: dashed }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.card h3 { font: 700 22px/1.15 var(--display); margin: 0; overflow-wrap: anywhere }
.card .cd { font: 700 15px var(--mono); letter-spacing: .14em; color: var(--muted) }
.picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; color: var(--muted) }
.picks b { color: var(--fg); font-weight: 600 }
.ver { border-radius: 8px; padding: 6px 10px; font: 700 15px/1.3 var(--display) }
.tone-good { background: var(--good-bg); color: var(--good) } .tone-warn { background: var(--warn-bg); color: var(--warn) } .tone-bad { background: var(--bad-bg); color: var(--bad) }
.nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px }
.nums div { min-width: 0 }
.nums .k { font-size: 12px; color: var(--muted) }
.nums .v { font: 700 20px/1.2 var(--display); font-variant-numeric: tabular-nums }
.best { display: flex; flex-wrap: wrap; gap: 6px }
.best span { font: 600 12px/1 var(--mono); padding: 5px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-line) }
.x { justify-self: end; padding: 4px 10px; font-size: 13px; color: var(--muted) }
.empty { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); display: grid; gap: 6px; align-content: start }
.empty b { color: var(--fg); font: 700 18px var(--display) }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 14px }
.danger { color: var(--bad); border-color: var(--bad) }
</style>

</head>

<script>
// Cold-store monitor model. Typical figures for teaching, not a quote.
const OPT = {
  sensor: [
    { id: 1, name: "Basic probe", sub: "DS18B20 on a lead, ±0.5 °C", cost: 4, acc: 0.5, door: false },
    { id: 2, name: "Calibrated probe", sub: "Lab-grade digital probe, ±0.1 °C, with a calibration certificate", cost: 35, acc: 0.1, door: false },
    { id: 3, name: "Probe + door switch", sub: "DS18B20 plus a magnetic contact on the door", cost: 9, acc: 0.5, door: true },
  ],
  link: [
    { id: 1, name: "Wi-Fi", sub: "Built into the ESP32; uses the site network", cost: 0, run: 0, batt: [0.5, 3, 5], cover: "poor" },
    { id: 2, name: "Zigbee", sub: "Low-power mesh to a coordinator nearby", cost: 12, run: 0, batt: [6, 18, 24], cover: "patchy" },
    { id: 3, name: "LoRaWAN", sub: "Long range, tiny messages, one gateway for the site", cost: 27, run: 0, batt: [8, 30, 36], cover: "good" },
    { id: 4, name: "NB-IoT", sub: "Cellular IoT with its own SIM", cost: 12, run: 12, batt: [3, 36, 48], cover: "good" },
  ],
  edge: [
    { id: 1, name: "Send everything", sub: "A reading every minute; the server decides", detect: 1, heartbeat: true, falseBase: 6 },
    { id: 2, name: "Alert on threshold", sub: "A reading every 10 min; sends at once if over the limit", detect: 1, heartbeat: false, falseBase: 6 },
    { id: 3, name: "Anomaly model on the chip", sub: "Learns normal door and compressor cycles; sends exceptions plus an hourly heartbeat", detect: -25, heartbeat: true, falseBase: 1 },
  ],
  act: [
    { id: 1, name: "Dashboard only", sub: "Someone looks at it in the morning", resp: null, cost: 0, run: 0 },
    { id: 2, name: "Text a group", sub: "SMS to the lab’s shared list", resp: 60, cost: 0, run: 6 },
    { id: 3, name: "On-call rota", sub: "Pages the on-call person, escalates after 15 min", resp: 15, cost: 0, run: 0 },
    { id: 4, name: "Automatic + on-call", sub: "Switches to a backup cooler, then pages on-call (human on the loop)", resp: 3, cost: 220, run: 0 },
  ],
};
const BOARD = 12; // ESP32 board and enclosure, £
const FAIL = 120, CROSS = 170, MORNING = 480; // minutes after midnight: compressor fails 02:00, passes 8 °C at 02:50, staff arrive 08:00
const tempAt = (m, actAt) => {
  if (m < FAIL) return 4.6 + Math.sin(m / 23) * 0.35;
  const base = 4.6 + Math.sin(FAIL / 23) * 0.35;
  const rise = (t) => base + (12 - base) * (1 - Math.exp(-(t - FAIL) / 90));
  if (actAt == null || m < actAt) return rise(m);
  const peak = rise(actAt);
  return Math.max(4.6, peak - (m - actAt) * 0.08);
};
const clock = (m) => { const h = Math.floor(m / 60), mm = Math.round(m % 60); return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); };
function evaluate(c) {
  const s = OPT.sensor[c[0] - 1], l = OPT.link[c[1] - 1], e = OPT.edge[c[2] - 1], a = OPT.act[c[3] - 1];
  const battMonths = l.batt[c[2] - 1];
  const swaps = 12 / battMonths;
  const cost = BOARD + s.cost + l.cost + a.cost;
  const running = l.run + a.run + swaps * 3;
  let falseAlarms = e.falseBase * (s.acc >= 0.5 ? 1.5 : 1) * (s.door ? 0.3 : 1);
  const falseRaw = falseAlarms;
  falseAlarms = Math.max(0, Math.round(falseAlarms));
  const detectAt = CROSS + e.detect;
  let actAt = a.resp == null ? MORNING : detectAt + a.resp;
  actAt = Math.max(actAt, FAIL + 5);
  const above = Math.max(0, Math.round(actAt - CROSS));
  const flags = [];
  if (l.cover === "poor") flags.push(["warn", "Wi-Fi often fails in basement cold rooms: readings can be lost without anyone noticing."]);
  if (l.cover === "patchy") flags.push(["note", "Zigbee needs a mains-powered router within a few rooms."]);
  if (battMonths < 2) flags.push(["warn", "Battery lasts about " + Math.round(battMonths * 4) + " weeks: this design really needs mains power."]);
  if (!e.heartbeat) flags.push(["warn", "No heartbeat: if the node dies, silence looks the same as “all fine”."]);
  if (a.resp == null) flags.push(["warn", "Nobody is told at night. The alarm waits for the morning."]);
  if (s.acc >= 0.5 && !s.door) flags.push(["note", "±0.5 °C near an 8 °C limit: set the alert at 7.5 °C, or accept missed edges."]);
  if (c[3] === 3) flags.push(["note", "Needs a staffed on-call rota and a clear escalation list."]);
  if (c[3] === 4) flags.push(["good", "Contains the problem before a person is awake. The person still decides about the stock."]);
  if (s.door) flags.push(["good", "The door switch tells a door left open from a failed compressor."]);
  if (e.detect < 0) flags.push(["good", "Spots the compressor failing before the temperature crosses the limit."]);
  if (l.run > 0) flags.push(["note", "SIM contract: about £" + l.run + " a year per fridge."]);
  let verdict, tone;
  if (above === 0) { verdict = "Stock stays within 2–8 °C."; tone = "good"; }
  else if (above <= 30) { verdict = "Short excursion: report it and get the stock assessed."; tone = "warn"; }
  else { verdict = "Long excursion: expect the stock to be quarantined."; tone = "bad"; }
  const story = [
    [FAIL, "Compressor fails. Temperature starts to rise."],
    e.detect < 0 ? [detectAt, "Node spots the failure pattern and raises an alert."] : [CROSS, "Fridge passes 8 °C."],
    e.detect < 0 ? [CROSS, actAt <= CROSS ? "Would have passed 8 °C here; it does not." : "Fridge passes 8 °C."] : [detectAt, a.resp == null ? "Reading reaches the dashboard. Nobody is looking." : "Alert sent."],
    [actAt, a.resp == null ? "First person in sees the dashboard." : c[3] === 4 ? "Backup cooler takes over; on-call is paged." : "Someone acts."],
  ].sort((x, y) => x[0] - y[0]);
  return { s, l, e, a, falseRaw, cost, running, battMonths, falseAlarms, detectAt, actAt, above, flags, verdict, tone, story };
}
const fmtBatt = (m) => (m < 1 ? Math.round(m * 4) + " weeks" : m < 12 ? m + " months" : m % 12 === 0 ? m / 12 + (m === 12 ? " year" : " years") : (m / 12).toFixed(1) + " years");
const fmtMins = (m) => (m === 0 ? "0 min" : m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min");


/*MODEL*/
const $ = (id) => document.getElementById(id);
const money = (n) => "£" + Math.round(n);
let rows = [], sortKey = "above", canWrite = true;
const KEY = "met-coldstore-wall-v1";
const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v.filter((r) => r && typeof r.team === "string" && valid(String(r.code))) : []; } catch { return []; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rows)); return true; } catch { return false; } };
const EXAMPLE = { id: "example", team: "Example: last year’s build", code: "1111", example: true };
const valid = (c) => /^[1-3][1-4][1-3][1-4]$/.test(c);
function metrics(row) { const r = evaluate(row.code.split("").map(Number)); return r; }
function sortRows(list) {
  const key = { above: (r) => r.m.above, cost: (r) => r.m.cost, false: (r) => r.m.falseRaw, batt: (r) => -r.m.battMonths, at: (r) => -(r.at || 0) }[sortKey];
  return list.slice().sort((a, b) => key(a) - key(b) || a.m.cost - b.m.cost);
}
function render() {
  const g = $("grid"); g.innerHTML = "";
  const list = rows.map((r) => ({ ...r, m: metrics(r) }));
  if (!list.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "<b>No designs yet</b><span>Each pair’s design appears here as you add its team name and code. The dashed card shows what one looks like.</span>";
    g.appendChild(e);
    list.push({ ...EXAMPLE, m: metrics(EXAMPLE) });
  }
  const real = list.filter((r) => !r.example);
  const bestOf = (f) => real.length > 1 ? Math.min(...real.map(f)) : null;
  const best = { above: bestOf((r) => r.m.above), cost: bestOf((r) => r.m.cost), fa: bestOf((r) => r.m.falseRaw), batt: real.length > 1 ? Math.max(...real.map((r) => r.m.battMonths)) : null };
  for (const r of sortRows(list)) {
    const c = document.createElement("article"); c.className = "card" + (r.example ? " example" : "");
    const m = r.m;
    c.innerHTML = '<div class="top"><h3></h3><span class="cd"></span></div><ul class="picks"></ul><div class="ver"></div><div class="nums"></div><div class="best"></div>';
    c.querySelector("h3").textContent = r.team;
    c.querySelector(".cd").textContent = r.code;
    const picks = c.querySelector(".picks");
    for (const [k, o] of [["Sense", m.s], ["Connect", m.l], ["Device", m.e], ["3 am", m.a]]) { const li = document.createElement("li"); li.append(k + ": "); const b = document.createElement("b"); b.textContent = o.name; li.appendChild(b); picks.appendChild(li); }
    const v = c.querySelector(".ver"); v.className = "ver tone-" + m.tone; v.textContent = m.verdict;
    const nums = c.querySelector(".nums");
    for (const [k, val] of [["Above 8 °C", fmtMins(m.above)], ["False alarms / month", m.falseRaw < 0.5 ? "under 1" : String(m.falseAlarms)], ["Kit per fridge", money(m.cost)], ["Battery", fmtBatt(m.battMonths)]]) { const d = document.createElement("div"); const kk = document.createElement("div"); kk.className = "k"; kk.textContent = k; const vv = document.createElement("div"); vv.className = "v"; vv.textContent = val; d.append(kk, vv); nums.appendChild(d); }
    const bb = c.querySelector(".best");
    if (!r.example) {
      if (best.above !== null && m.above === best.above) bb.insertAdjacentHTML("beforeend", "<span>Safest</span>");
      if (best.cost !== null && m.cost === best.cost) bb.insertAdjacentHTML("beforeend", "<span>Cheapest</span>");
      if (best.fa !== null && m.falseRaw === best.fa) bb.insertAdjacentHTML("beforeend", "<span>Fewest false alarms</span>");
      if (best.batt !== null && m.battMonths === best.batt) bb.insertAdjacentHTML("beforeend", "<span>Longest battery</span>");
    }
    if (canWrite && !r.example) { const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "Remove"; x.setAttribute("aria-label", "Remove " + r.team); x.onclick = () => { rows = rows.filter((y) => y.id !== r.id); save(); render(); }; c.appendChild(x); }
    g.appendChild(c);
  }
}
function say(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }
document.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => { sortKey = b.dataset.sort; document.querySelectorAll("[data-sort]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); render(); }));
$("code").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); });
$("entry").addEventListener("submit", async (e) => {
  e.preventDefault();
  const team = $("team").value.trim(), code = $("code").value.trim();
  if (!team) return say("Add a team name first.", true);
  if (!valid(code)) return say("That code isn’t valid. Use four digits: sensor 1–3, link 1–4, device 1–3, who acts 1–4.", true);
  rows.push({ id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), team, code, at: Date.now() });
  const ok = save(); render();
  say(ok ? "Added " + team + "." : "Added " + team + ". This browser is not saving, so download the results before closing.", !ok);
  $("team").value = ""; $("code").value = ""; $("team").focus();
});
$("clear").addEventListener("click", () => {
  const box = $("clearbox"); box.innerHTML = "";
  const w = document.createElement("div"); w.className = "confirm"; w.textContent = "Remove all " + rows.length + " designs?";
  const yes = document.createElement("button"); yes.type = "button"; yes.className = "danger"; yes.textContent = "Clear";
  const no = document.createElement("button"); no.type = "button"; no.textContent = "Keep";
  const reset = () => { box.innerHTML = ""; const b = document.createElement("button"); b.type = "button"; b.id = "clear"; b.textContent = "Clear the wall"; box.appendChild(b); b.onclick = () => $("clear").dispatchEvent(new Event("click")); };
  no.onclick = reset;
  yes.onclick = () => { rows = []; save(); render(); reset(); };
  w.append(yes, no); box.appendChild(w);
});
render();
rows = load();
$("entry").hidden = false; $("clearbox").hidden = false;
$("dl").addEventListener("click", () => {
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const head = ["team", "code", "sensor", "link", "device", "who_acts", "minutes_above_8C", "false_alarms_month", "kit_cost_gbp", "battery_months", "added"];
  const lines = [head.join(",")].concat(rows.map((r) => { const m = metrics(r); return [r.team, r.code, m.s.name, m.l.name, m.e.name, m.a.name, m.above, m.falseAlarms, Math.round(m.cost), m.battMonths, new Date(r.at).toISOString()].map(esc).join(","); }));
  const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  const a = document.createElement("a"); a.href = url; a.download = "cold-store-designs-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
render();
</script>
